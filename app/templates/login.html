 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | School Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at top left, #243b70 0, transparent 38%),
                linear-gradient(135deg, #0b1220, #111c32 60%, #172744);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 980px;
            display: grid;
            grid-template-columns: 0.9fr 1.1fr;
            overflow: hidden;
            border-radius: 24px;
            background: white;
            box-shadow: 0 28px 80px rgba(0, 0, 0, 0.35);
        }

        .welcome-panel {
            padding: 48px 36px;
            color: white;
            background: linear-gradient(155deg, #2449a5, #152653 75%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .brand-mark {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 25px;
            font-weight: 700;
        }

        .welcome-panel h1 {
            font-size: 32px;
            line-height: 1.3;
            font-weight: 750;
            margin: 32px 0 16px;
        }

        .welcome-panel p {
            color: #d2ddf8;
            line-height: 1.8;
            font-size: 14px;
        }

        .welcome-footer {
            font-size: 12px;
            color: #b9c9ed;
            margin-top: 40px;
        }

        .form-panel {
            padding: 48px 46px;
        }

        .eyebrow {
            color: #315bc4;
            font-size: 12px;
            font-weight: 750;
            text-transform: uppercase;
            letter-spacing: 1.6px;
        }

        .form-panel h2 {
            font-size: 29px;
            font-weight: 750;
            margin-top: 10px;
            color: #14213b;
        }

        .subtitle {
            color: #7b8495;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 650;
            color: #344057;
            margin-bottom: 8px;
        }

        .form-control {
            min-height: 48px;
            border: 1px solid #dce2ec;
            border-radius: 11px;
            padding: 12px 14px;
            background: #f9faff;
            font-size: 14px;
        }

        .form-control:focus {
            border-color: #4169d8;
            background: white;
            box-shadow: 0 0 0 4px rgba(65, 105, 216, 0.12);
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 11px;
            background: linear-gradient(100deg, #315bc4, #2446a0);
            color: white;
            font-size: 15px;
            font-weight: 700;
            margin-top: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-login:hover {
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 9px 22px rgba(49, 91, 196, 0.28);
        }

        .back-link {
            display: inline-block;
            margin-top: 22px;
            color: #53627b;
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover {
            color: #315bc4;
        }

        @media (max-width: 700px) {
            .login-wrapper {
                grid-template-columns: 1fr;
                max-width: 480px;
            }

            .welcome-panel {
                padding: 28px;
            }

            .welcome-panel h1 {
                font-size: 25px;
                margin-top: 20px;
            }

            .welcome-footer {
                margin-top: 20px;
            }

            .form-panel {
                padding: 32px 26px;
            }

            .form-panel h2 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>
    <main class="login-wrapper">

        <section class="welcome-panel">
            <div>
                <div class="brand-mark">S</div>

                <h1>Welcome back to your school portal.</h1>

                <p>
                    Sign in to access your account and manage
                    your academic activities from one place.
                </p>
            </div>

            <div class="welcome-footer">
                SCHOOL MANAGEMENT SYSTEM · SECURE LOGIN
            </div>
        </section>

        <section class="form-panel">
            <div class="eyebrow">Welcome back</div>
            <h2>Sign in to continue</h2>
            <p class="subtitle">Enter your username and password below.</p>

            {% if error %}
                <div class="alert alert-danger rounded-3 small" role="alert">
                    {{ error }}
                </div>
            {% endif %}

            <form action="{{ url_for('main.login') }}" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-control"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div class="mb-4">
                    <label for="role" class="form-label">Login As</label>
                    <select id="role" name="role" class="form-select" required>
                        <option value="" selected disabled>Select your role</option>
                        <option value="admin">Admin</option>
                        <option value="teacher">Teacher</option>
                        <option value="student">Student</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-login">
                    Sign In &rarr;
                </button>
            </form>

            <a href="{{ url_for('main.home') }}" class="back-link">
                &larr; Back to Home
            </a>
        </section>

    </main>
</body>
</html>
