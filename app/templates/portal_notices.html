<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ portal }} Notices | SchoolPortal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{background:#f6f8fb;color:#243044}.main{max-width:1000px;margin:auto;padding:30px}.card{border:0;box-shadow:0 8px 24px rgba(34,51,84,.07)}</style>
</head>
<body>
<main class="main">
    <div class="d-flex justify-content-between align-items-center mb-4"><div><div class="text-uppercase text-secondary small">{{ portal }} Portal</div><h1 class="h3 mb-0">School Notices</h1></div><a class="btn btn-outline-secondary" href="{{ url_for('main.' + portal|lower + '_dashboard') }}">Dashboard</a></div>
    <div class="card p-4">
        {% if notices %}{% for notice in notices %}<a class="d-block text-decoration-none text-reset border-bottom py-3" href="{{ url_for(detail_endpoint, notice_id=notice.id) }}"><div class="d-flex justify-content-between gap-3"><h2 class="h5 mb-1">{{ notice.title }}</h2><small class="text-secondary">{{ notice.notice_date }}</small></div><p class="text-secondary mb-0">{{ notice.body|truncate(180) }}</p></a>{% endfor %}
        {% else %}<div class="text-center text-secondary py-4">No notices published yet.</div>{% endif %}
    </div>
</main>
</body>
</html>
