<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ notice.title }} | SchoolPortal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{background:#f6f8fb;color:#243044}.main{max-width:850px;margin:auto;padding:30px}.card{border:0;box-shadow:0 8px 24px rgba(34,51,84,.07)}</style>
</head>
<body>
<main class="main">
    <div class="d-flex justify-content-between align-items-center mb-4"><div><div class="text-uppercase text-secondary small">{{ portal }} Portal</div><h1 class="h3 mb-0">Notice</h1></div><a class="btn btn-outline-secondary" href="{{ url_for(back_endpoint) }}">Back</a></div>
    <article class="card p-4"><div class="d-flex justify-content-between gap-3 mb-3"><h2 class="h4 mb-0">{{ notice.title }}</h2><span class="text-secondary">{{ notice.notice_date }}</span></div><p class="mb-0" style="white-space: pre-line;">{{ notice.body }}</p>{% if admin_view %}<div class="mt-4 text-secondary small">Audience: {{ notice.audience }} · {{ 'Published' if notice.is_published else 'Draft' }}</div>{% endif %}</article>
</main>
</body>
</html>
