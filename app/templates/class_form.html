<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if classroom %}Edit Class{% else %}Add Class{% endif %} | SchoolPortal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root{--navy:#111c3a;--blue:#4568f5;--muted:#7b8499;--canvas:#f5f7fc;--border:#edf0f7}
        body{background:var(--canvas);font-family:Inter,"Segoe UI",sans-serif}.page{max-width:850px;padding:30px 18px;margin:auto}.panel{background:#fff;border:1px solid var(--border);border-radius:17px;padding:28px;box-shadow:0 5px 20px rgba(26,43,83,.035)}h2{color:var(--navy);font-weight:750}.muted{color:var(--muted);font-size:14px}.form-label{color:var(--navy);font-size:13px;font-weight:650}.form-control,.form-select{border-color:#e3e8f2;border-radius:9px;padding:11px 12px}.btn-primary{background:var(--blue);border-color:var(--blue)}.btn-primary:hover{background:#3454df;border-color:#3454df}
    </style>
</head>
<body><main class="page">
    <div class="mb-4"><a href="{{ url_for('main.admin_classes') }}" class="text-decoration-none muted">← Back to Classes</a><h2 class="mt-3 mb-2">{% if classroom %}Edit Class{% else %}Add New Class{% endif %}</h2><p class="muted">Create a class and optionally assign its class teacher.</p></div>
    {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
    <section class="panel"><form method="POST"><div class="row g-3">
        <div class="col-md-6"><label class="form-label" for="name">Class Name *</label><input id="name" name="name" class="form-control" maxlength="80" required value="{{ request.form.get('name', classroom.name if classroom else '') }}"></div>
        <div class="col-md-6"><label class="form-label" for="class_teacher_id">Class Teacher</label><select id="class_teacher_id" name="class_teacher_id" class="form-select"><option value="">Unassigned</option>{% for teacher in teachers %}<option value="{{ teacher.id }}" {% if request.form.get('class_teacher_id', classroom.class_teacher_id if classroom else '')|string == teacher.id|string %}selected{% endif %}>{{ teacher.full_name }}</option>{% endfor %}</select></div>
        <div class="col-12"><label class="form-label" for="description">Description</label><textarea id="description" name="description" class="form-control" maxlength="250">{{ request.form.get('description', classroom.description if classroom and classroom.description else '') }}</textarea></div>
        <div class="col-12"><div class="form-check form-switch mt-2"><input class="form-check-input" type="checkbox" id="is_active" name="is_active" {% if request.method == 'POST' %}{% if request.form.get('is_active') == 'on' %}checked{% endif %}{% elif not classroom or classroom.is_active %}checked{% endif %}><label class="form-check-label" for="is_active">Active class</label></div></div>
    </div><hr class="my-4"><div class="d-flex justify-content-end gap-2"><a href="{{ url_for('main.admin_classes') }}" class="btn btn-light border px-4">Cancel</a><button type="submit" class="btn btn-primary px-4">{% if classroom %}Save Changes{% else %}Add Class{% endif %}</button></div></form></section>
</main></body></html>
